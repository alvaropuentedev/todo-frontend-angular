server {
    listen 80;
    server_name localhost;

    # 1. Frontend de Angular
    location /todoapp/ {
        alias /usr/share/nginx/html/;
        index index.html index.htm;
        try_files $uri $uri/ /todoapp/index.html;
    }

    # 2. Proxy para la API REST (HTTP normal)
    location /apitodo/ {
        proxy_pass http://todo_app_backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy dedicado para WebSockets (Ajuste crítico)
    location /apitodo/ws/ {
        proxy_pass http://todo_app_backend:8080/ws;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Requisitos fundamentales para WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_cache_bypass $http_upgrade;

        # Timeouts largos para que la conexión WS no se corte por inactividad
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}