server {
    listen 80;
    server_name localhost;

    # Frontend de Angular
    location /todoapp/ {
        alias /usr/share/nginx/html/;
        index index.html index.htm;
        try_files $uri $uri/ /todoapp/index.html;
    }

    # Proxy interno hacia el Backend Java (Red Docker)
    location /apitodo/ {
        # 'todo_app_backend' debe ser el nombre exacto de tu contenedor/servicio Java
        proxy_pass http://todo_app_backend:8080/;

        # Cabeceras estándar de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}